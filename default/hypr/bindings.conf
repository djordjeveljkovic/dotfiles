# -----------------------------------------------------
# Variables
# -----------------------------------------------------
$terminal          = alacritty
$browser           = google-chrome-stable
$webapp            = $browser --app
$podman_as_docker  = DOCKER_HOST=unix:///run/user/$(id -u)/podman/podman.sock

# -----------------------------------------------------
# Applications
# -----------------------------------------------------
bind = SUPER, B,      exec, $browser
bind = SUPER, return, exec, $terminal
bind = SUPER, G,      exec, steam

# Floating Terminal Apps
bind = SUPER, E,       exec, $terminal --class=com.x.FloatingWindow -e yazi
bind = SUPER, T,       exec, $terminal --class=com.x.FloatingWindow -e btop
bind = SUPER, Z,       exec, $terminal --class=com.x.FloatingWindow -e impala
bind = SUPER, X,       exec, $terminal --class=com.x.FloatingWindow -e wiremix
bind = SUPER, C,       exec, $terminal --class=com.x.FloatingWindow -e bluetui
bind = SUPER SHIFT, C, exec, $terminal --class=com.x.FloatingWindow -e calcure
bind = SUPER, grave,   exec, $terminal --class=com.x.FloatingWindow -e ~/.dots/bin/script-manage
bind = SUPER, P,       exec, $terminal --class=com.x.FloatingWindow -e ~/.dots/bin/script-wallpaper
bind = SUPER SHIFT, P, exec, ~/.dots/bin/script-monitors-pick
bind = SUPER, D,       exec, bash -c '$podman_as_docker $terminal --class=FloatingWindow -e lazydocker'

# Web Apps & Tools
bind = SUPER, A,       exec, $webapp="https://chatgpt.com"
bind = SUPER SHIFT, A, exec, $webapp="https://gemini.google.com/u/0/app"
# Antigravity is opt-in (--antigravity flag). Bind only if installed.
# bind = SUPER ALT, A, exec, $HOME/Downloads/antigravity/Antigravity/antigravity

# -----------------------------------------------------
# System & Aesthetics
# -----------------------------------------------------
bind = SUPER, SPACE,       exec, fuzzel --lines 5
bind = SUPER SHIFT, SPACE, exec, pkill -SIGUSR1 waybar
bind = SUPER, ESCAPE,      exec, ~/.dots/bin/script-power
bind = SUPER, N,           exec, ~/.dots/bin/script-toggle-sunset
bind = SUPER SHIFT, N, exec, ~/.dots/bin/script-toggle-theme

# Scripts & Info
bind = SUPER CTRL, I,  exec, ~/.dots/bin/script-toggle-idle
# script-info sends a single mako notification (centered, via the
# patched mako's x-dots-position hint) and exits. No terminal, no
# interactive loop. The notification auto-dismisses via mako's
# default-timeout.
bind = SUPER, I,       exec, ~/.dots/bin/script-info
bind = SUPER SHIFT, K, exec, ~/.dots/bin/script-show-keybindings
bind = SUPER, V,       exec, cliphist list | fuzzel --dmenu | cliphist decode | wl-copy 

# Notifications (Mako)
bind = SUPER, comma,       exec, makoctl dismiss
bind = SUPER SHIFT, comma, exec, makoctl dismiss --all
bind = SUPER CTRL, comma,  exec, makoctl mode -t do-not-disturb && makoctl mode | grep -q 'do-not-disturb' && notify-send "Silenced notifications" || notify-send "Enabled notifications"

# -----------------------------------------------------
# Media & Hardware
# -----------------------------------------------------

# Volume & Mic — wpctl via ~/.dots/bin/script-audio (mako feedback).
# bind = fires on key press, bindr = fires on key release. Pair
# them on the same key to start the hold loop on press and stop
# it on release, giving the swayosd-style 'hold to ramp' UX.
# NOTE: binde is NOT the right thing here — it fires only on
# the release of a 'locked' key (e.g. CapsLock release), not
# on every key release. bindl also doesn't work — it fires the
# same handler on both press and release, so the start and stop
# would cancel each other.
bind  = , XF86AudioRaiseVolume, exec, ~/.dots/bin/script-audio-hold up   start
bindr = , XF86AudioRaiseVolume, exec, ~/.dots/bin/script-audio-hold up   stop
bind  = , XF86AudioLowerVolume, exec, ~/.dots/bin/script-audio-hold down start
bindr = , XF86AudioLowerVolume, exec, ~/.dots/bin/script-audio-hold down stop
bind = , XF86AudioMute,        exec, ~/.dots/bin/script-audio mute
bind = , XF86AudioMicMute,     exec, ~/.dots/bin/script-audio mic

# Brightness — brightnessctl via ~/.dots/bin/script-brightness (mako feedback)
bind = , XF86MonBrightnessUp,   exec, ~/.dots/bin/script-brightness up
bind = , XF86MonBrightnessDown, exec, ~/.dots/bin/script-brightness down

# Player Controls — playerctl via ~/.dots/bin/script-media (mako feedback)
bind = , XF86AudioNext,  exec, ~/.dots/bin/script-media next
bind = , XF86AudioPrev,  exec, ~/.dots/bin/script-media prev
bind = , XF86AudioPlay,  exec, ~/.dots/bin/script-media toggle
bind = , XF86AudioPause, exec, ~/.dots/bin/script-media toggle

# Keyboard Layout — see ~/.dots/bin/script-notify-layout (compositor-neutral)
bind = ALT, SHIFT_L, exec, ~/.dots/bin/script-notify-layout

# -----------------------------------------------------
# Screenshots & Color Picker
# -----------------------------------------------------
# script-screenshot (not the upstream hyprshot) so the mako
# notification shows the actual image preview: it composites
# the screenshot with a caption and sends it via the image-path
# hint, which mako's [app-name=screenshot] block renders at
# icon-location=top. Without this, hyprshot's own notification
# would be text-only.
bind = , PRINT,           exec, ~/.dots/bin/script-screenshot region
bind = SHIFT, PRINT,      exec, ~/.dots/bin/script-screenshot window
bind = CTRL, PRINT,       exec, ~/.dots/bin/script-screenshot output
bind = SUPER, S,          exec, ~/.dots/bin/script-screenshot region
bind = SUPER SHIFT, S,    exec, ~/.dots/bin/script-screenshot window
bind = SUPER CTRL, S,     exec, ~/.dots/bin/script-screenshot output
bind = SUPER, PRINT,      exec, hyprpicker -a
bind = SUPER ALT, S,      exec, hyprpicker -a

# -----------------------------------------------------
# Window Management & Tiling
# -----------------------------------------------------
bind = SUPER, W, killactive,
bind = SUPER, F, exec, hyprctl dispatch togglefloating && hyprctl dispatch centerwindow activewindow
bind = SUPER, O, layoutmsg, orientationnext

# Focus Movement
bind = SUPER, left,  movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up,    movefocus, u
bind = SUPER, down,  movefocus, d
bind = SUPER, h,     movefocus, l
bind = SUPER, l,     movefocus, r
bind = SUPER, k,     movefocus, u
bind = SUPER, j,     movefocus, d

# Swap Windows
bind = SUPER SHIFT, left,  swapwindow, l
bind = SUPER SHIFT, right, swapwindow, r
bind = SUPER SHIFT, up,    swapwindow, u
bind = SUPER SHIFT, down,  swapwindow, d
bind = SUPER SHIFT, h,     swapwindow, l
bind = SUPER SHIFT, l,     swapwindow, r
bind = SUPER SHIFT, k,     swapwindow, u
bind = SUPER SHIFT, j,     swapwindow, d

# Tab Cycling
bind = ALT, TAB, cyclenext
bind = ALT, TAB, alterzorder, top

# -----------------------------------------------------
# Workspaces
# -----------------------------------------------------

# Switch Workspaces
bind = SUPER, code:10, workspace, 1
bind = SUPER, code:11, workspace, 2
bind = SUPER, code:12, workspace, 3
bind = SUPER, code:13, workspace, 4
bind = SUPER, code:14, workspace, 5
bind = SUPER, code:15, workspace, 6
bind = SUPER, code:16, workspace, 7
bind = SUPER, code:17, workspace, 8
bind = SUPER, code:18, workspace, 9
bind = SUPER, code:19, workspace, 10

# Move Window to Workspace
bind = SUPER SHIFT, code:10, movetoworkspacesilent, 1
bind = SUPER SHIFT, code:11, movetoworkspacesilent, 2
bind = SUPER SHIFT, code:12, movetoworkspacesilent, 3
bind = SUPER SHIFT, code:13, movetoworkspacesilent, 4
bind = SUPER SHIFT, code:14, movetoworkspacesilent, 5
bind = SUPER SHIFT, code:15, movetoworkspacesilent, 6
bind = SUPER SHIFT, code:16, movetoworkspacesilent, 7
bind = SUPER SHIFT, code:17, movetoworkspacesilent, 8
bind = SUPER SHIFT, code:18, movetoworkspacesilent, 9
bind = SUPER SHIFT, code:19, movetoworkspacesilent, 10

# Workspace Cycling
bind = SUPER,       mouse_down, exec, ~/.dots/bin/workspace-cycle next
bind = SUPER,       mouse_up,   exec, ~/.dots/bin/workspace-cycle prev
bind = SUPER,       TAB,        exec, ~/.dots/bin/workspace-cycle next
bind = SUPER SHIFT, TAB,        exec, ~/.dots/bin/workspace-cycle prev

# Mouse Bindings
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# -----------------------------------------------------
# Submap: MOVE_RESIZE
# -----------------------------------------------------
bind = SUPER, R, submap, MOVE_RESIZE

submap = MOVE_RESIZE
    binde = , F, fullscreen
    
    # Move
    binde = , H, moveactive, -20 0
    binde = , L, moveactive, 20 0
    binde = , K, moveactive, 0 -20
    binde = , J, moveactive, 0 20

    # Resize (ALT)
    binde = ALT, h, resizeactive, -20 0
    binde = ALT, l, resizeactive, 20 0
    binde = ALT, k, resizeactive, 0 -20
    binde = ALT, j, resizeactive, 0 20

    # Combined Move/Resize (SHIFT)
    binde = SHIFT, h, moveactive, -20 0
    binde = SHIFT, h, resizeactive, 20 0
    binde = SHIFT, l, moveactive, 20 0
    binde = SHIFT, l, resizeactive, -20 0
    binde = SHIFT, k, moveactive, 0 -20
    binde = SHIFT, k, resizeactive, 0 20
    binde = SHIFT, j, moveactive, 0 20
    binde = SHIFT, j, resizeactive, 0 -20

    # Exit Mode
    bind = , escape, submap, reset
submap = reset

unbind = ALT, F4

