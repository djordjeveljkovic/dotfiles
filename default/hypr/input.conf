input {
    kb_layout = us,rs,rs
    kb_variant = ,latin,
    # grp:alt_shift_toggle makes Alt+Shift cycle through the XKB
    # layouts declared above. The other options keep Caps as Ctrl
    # and make the right Win key act as a second AltGr (so the
    # Serbian Cyrillic / Latin pair stays reachable from either side
    # of the keyboard).
    kb_options = grp:alt_shift_toggle, ctrl:nocaps, altwin:menu_win, altwin:altgr

    repeat_rate = 40
    repeat_delay = 600

    follow_mouse = 1

    sensitivity = 0

    touchpad {
        natural_scroll = true
        clickfinger_behavior = true
        scroll_factor = 0.4
    }
}
binde=, Prior, resizeactive, -10 0 
binde=, Next, resizeactive, 10 0
binds {
    workspace_back_and_forth = true
}
