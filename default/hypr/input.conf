input {
    kb_layout = us,rs,rs
    kb_variant = ,latin,
    kb_options = ctrl:nocaps, altwin:menu_win

    repeat_rate = 40
    repeat_delay = 600

    follow_mouse = 1

    sensitivity = 0

    touchpad {
        natural_scroll = true
        clickfinger_behavior = true
        scroll_factor = 0.4
    }
}
