# Application bindings
$terminal = alacritty
$browser = google-chrome-stable --force-device-scale-factor=1
$webapp = $browser --app

# Launching
bind = SUPER, return, exec, $terminal
bind = SUPER, E, exec, nautilus --new-window
bind = SUPER, B, exec, $browser
bind = SUPER, D, exec, $terminal -e lazydocker

bind = SUPER, A, exec, $webapp="https://chatgpt.com"
bind = SUPER SHIFT, A, exec, $webapp="https://gemini.google.com/u/0/app"
bind = SUPER, Y, exec, $webapp="https://youtube.com/"
bind = SUPER, M, exec, $webapp="https://web.whatsapp.com/"
bind = SUPER SHIFT, M, exec, $webapp="https://messages.google.com/web/conversations"
bind = SUPER ALT, M, exec, $webapp="https://music.youtube.com/"
bind = SUPER, SPACE, exec, ~/.dots/bin/script-wofi
bind = SUPER ALT, k, exec, ~/.dots/bin/script-show-keybindings

# Aesthetics
bind = SUPER SHIFT, SPACE, exec, pkill -SIGUSR1 waybar
bind = SUPER CTRL, SPACE, exec, ~/.dots/bin/script-theme-bg-next
bind = SUPER SHIFT CTRL, SPACE, exec, ~/.dots/bin/script-theme-menu

# Notifications
bind = SUPER, comma, exec, makoctl dismiss
bind = SUPER SHIFT, comma, exec, makoctl dismiss --all
bind = SUPER CTRL, comma, exec, makoctl mode -t do-not-disturb && makoctl mode | grep -q 'do-not-disturb' && notify-send "Silenced notifications" || notify-send "Enabled notifications"

# Power menu controls lock, suspend, relaunch, restart, shutdown
bind = SUPER, ESCAPE, exec, ~/.dots/bin/script-power-menu
bind = SUPER, p, exec, ~/.dots/bin/script-monitor-display

# Toggle idling
bind = SUPER CTRL, I, exec, ~/.dots/bin/script-toggle-idle

# Clipboard history
bind = SUPER, V, exec, cliphist list | wofi --dmenu --style="$HOME/.dots/default/wofi/search.css" | cliphist decode | wl-copy 

# Screenshots
bind = , PRINT, exec, hyprshot -m region
bind = SHIFT, PRINT, exec, hyprshot -m window
bind = CTRL, PRINT, exec, hyprshot -m output
bind = SUPER, S, exec, hyprshot -m region
bind = SUPER SHIFT, S, exec, hyprshot -m window
bind = SUPER CTRL, S, exec, hyprshot -m output

# Color picker
bind = SUPER, PRINT, exec, hyprpicker -a
bind = SUPER ALT, S, exec, hyprpicker -a
