# Autostart for the Hyprland adapter. Runs after the Hyprland session
# initialises. Only contains items that Hyprland itself does not start.

exec-once = hypridle
exec-once = mako
# swayosd-server powers the volume/brightness OSD used by XF86* bindings
exec-once = swayosd-server
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
# Wallpaper: hyprpaper reads ~/.config/hypr/hyprpaper.conf
exec-once = hyprpaper