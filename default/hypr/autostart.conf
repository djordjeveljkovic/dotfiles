# Autostart for the Hyprland adapter. Runs after the Hyprland session
# initialises. Only contains items that Hyprland itself does not start.

exec-once = hypridle
# Bring up the secondary D-Bus session bus used by the bottom mako.
exec-once = ~/.dots/bin/dots-session-buses
# Top-right mako: receives normal notify-send calls (default D-Bus bus).
exec-once = mako
# Bottom-center mako: receives system-info OSDs routed through
# dots-system-notify (secondary D-Bus bus started above).
exec-once = env DBUS_SESSION_BUS_ADDRESS="$(cat ~/.config/dots/bus-bottom)" mako -c ~/.dots/config/mako/config-bottom
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
# Wallpaper: hyprpaper reads ~/.config/hypr/hyprpaper.conf
exec-once = hyprpaper