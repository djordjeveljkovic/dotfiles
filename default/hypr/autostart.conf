# Autostart for the Hyprland adapter. Runs after the Hyprland session
# initialises. Only contains items that Hyprland itself does not start.

exec-once = hypridle
# Single mako handles both top-right (default) and bottom-center
# (when the caller sets the x-dots-position D-Bus hint). The
# custom mako at ~/.local/bin/mako supports per-notification
# positions; the system /usr/bin/mako is the upstream build
# which silently ignores the hint. We invoke the local copy
# by full path so the autostart works regardless of PATH.
exec-once = /home/usrtmp/.local/bin/mako
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
# Wallpaper: hyprpaper reads ~/.config/hypr/hyprpaper.conf
exec-once = hyprpaper