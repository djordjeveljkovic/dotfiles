# ~/.dots manifest
# This file describes every file the repo manages on the live system and the
# symlink/relationship between the canonical repo file and the live file in
# $HOME. The bin/script-audit-system command reads this manifest to detect
# drift, missing files, and stale ownership of leftover Omarchy integration.
#
# Format: one managed item per line. Comments (#) and blank lines are
# ignored. Each managed line has up to four whitespace-separated fields:
#
#   kind live-path           repo-source                notes
#
# kind may be:
#   link   - create a symlink at live-path pointing to repo-source
#   file   - copy repo-source to live-path (used rarely; prefer link)
#
# repo-source is resolved relative to DOTS_DIR (= ~/.dots).
# live-path is resolved relative to $HOME.
#
# Entries added by ~/.dots must never be absolute paths containing
# machine-specific data (e.g. /home/<user>/...). Use $HOME or the wildcard
# token HOME, which the audit/install scripts expand.

# --- Desktop applications ---------------------------------------------------
link  .config/alacritty                 config/alacritty
link  .config/btop                      config/btop
link  .config/fastfetch                 config/fastfetch
link  .config/git                       config/git
link  .config/hypr                      config/hypr
link  .config/nvim                      config/nvim
link  .config/sway                      default/sway
link  .config/waybar                    config/waybar
link  .config/zed                       config/zed

# --- User systemd (only the durable, machine-agnostic services) -------------
link  .config/systemd/user/battery-monitor.service config/systemd/user/battery-monitor.service
link  .config/systemd/user/battery-monitor.timer  config/systemd/user/battery-monitor.timer
link  .config/systemd/user/time-notify.service     config/systemd/user/time-notify.service
link  .config/systemd/user/time-notify.timer      config/systemd/user/time-notify.timer

# --- User home dotfiles -----------------------------------------------------
link  .bashrc                            default/bash/rc
link  .tmux.conf                         default/.tmux.conf
link  .config/ssh/config                 default/sshconfig

# --- Active theme (managed by script-toggle-theme) --------------------------
# script-toggle-theme creates the destination directory and re-links the file
# each time it runs, so we don't link ~/.config/mako as a directory here.
link  .config/mako/config                themes/catppuccin/mako.ini
link  .config/btop/themes/current.theme  themes/catppuccin/btop.theme
# ~/.dots/current/theme is owned by bin/script-toggle-theme and is intentionally
# left out of the manifest so the apply step does not overwrite the toggle.
# --- pi coding assistant config -------------------------------------------
link  .pi/settings.json                  .pi/settings.json
