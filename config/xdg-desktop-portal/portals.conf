# xdg-desktop-portal — which backend implements which interface.
#
# Without this file, portal autodetect picks whichever backend claims the
# org.freedesktop.impl.portal.* well-known name on dbus. On sway that race is
# unreliable: xdg-desktop-portal-gtk can win the Screenshot interface and
# return empty buffers, which silently breaks screen sharing in
# Chrome/Discord/OBS. Pin the choices here.
#
# References:
#   https://github.com/flatpak/xdg-desktop-portal/blob/master/portals.conf.rst
#   https://github.com/emersion/xdg-desktop-portal-wlr

[preferred]
# Screenshot + ScreenCast → wlroots (sway) backend
# NOTE: the interface name is "ScreenCast" (capital C, no lowercase t).
# This is the one of the most-Googled typos in xdg-desktop-portal config.
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.ScreenCast=wlr

# Everything else → GTK (file chooser, app chooser, notifications, settings…)
default=gtk
org.freedesktop.impl.portal.FileChooser=gtk
org.freedesktop.impl.portal.AppChooser=gtk
org.freedesktop.impl.portal.Notification=gtk
org.freedesktop.impl.portal.Settings=gtk
