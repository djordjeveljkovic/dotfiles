# xdg-desktop-portal-wlr — backend-specific config.
#
# When an app calls org.freedesktop.portal.ScreenCast.CreateSession, wlr-portal
# shows a chooser. This file tunes that chooser.
#
#   [output]
#     chooser_type:
#       simple   — slurp over the whole virtual desktop; user drags a region.
#                  Painful for "I just want to share my second monitor".
#       monitor  — fuzzel list of available outputs, click one. Smoother.
#       none     — auto-pick the focused output, no prompt.
#       custom   — use chooser_cmd for both monitor and window selection.
#     chooser_cmd: only used when chooser_type=custom. Must be an absolute
#                  path; wlr-portal execs it with the option list on stdin
#                  and reads the picked line from stdout.
#
#   [screencast]
#     max_fps  — cap the framerate apps can request (0 = unlimited).
#
# We use chooser_type=custom so the same chooser handles both monitor and
# window selection. The custom chooser (~/.dots/bin/script-share-chooser)
# passes monitor selection through fuzzel directly and ENRICHES window
# selection with workspace labels pulled from `swaymsg -t get_tree`.
#
# Why custom for windows: wlr-portal tracks toplevels via the
# zwlr-foreign-toplevel-manager-v1 protocol, which on sway appears to drop
# toplevels on off-workspace / unfocused outputs. The custom chooser
# bypasses that and shows the full window list across all workspaces, so
# you can actually share a window that's on a different workspace.
#
# Docs: https://github.com/emersion/xdg-desktop-portal-wlr#configuration

[output]
chooser_type=custom
chooser_cmd=/home/usr/.dots/bin/script-share-chooser

[screencast]
max_fps=60
