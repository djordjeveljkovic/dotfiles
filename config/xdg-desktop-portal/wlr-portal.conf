# xdg-desktop-portal-wlr — backend-specific config.
#
# When an app calls org.freedesktop.portal.Screencast.CreateSession, wlr-portal
# shows a chooser (slurp, by default) to pick an output or region. This file
# tunes that chooser.
#
#   [output]
#     chooser_type:
#       simple   — slurp over the whole virtual desktop; user picks output OR
#                  region in one go. Best default for single / dual-monitor sway.
#       none     — auto-pick the focused output, no prompt.
#     chooser_cmd: only used when chooser_type=custom (e.g. `wofi`, `fuzzel`).
#
#   [screencast]
#     max_fps  — cap the framerate apps can request (0 = unlimited).
#
# Docs: https://github.com/emersion/xdg-desktop-portal-wlr#configuration

[output]
chooser_type=simple
# chooser_cmd=slurp

[screencast]
max_fps=60
