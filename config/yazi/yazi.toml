# =====================================================
# Yazi — terminal file manager
# Docs: https://yazi-rs.github.io/docs/configuration
# =====================================================
# Image preview: this distro's /usr/bin/alacritty is not built with the
# `--features=sixel` Cargo flag, so yazi's `auto` adapter falls back to
# `ueberzugpp`, which uses wlr-layer-shell and pops a separate client
# surface over the terminal instead of rendering inline. Force the chafa
# adapter (chafa is in the base image) so previews are true inline
# ANSI/Unicode art in the preview pane. To get pixel-accurate inline
# previews instead, rebuild alacritty with `cargo install alacritty
# --features=sixel,wayland` and switch this back to `auto`.

# ---- Manager (file list) -----------------------------------------------
[manager]
ratio          = [1, 4, 3]      # parent list : current : preview
show_hidden    = false
sort_by        = "name"         # none | mtime | btime | atime | size | ext | name
sort_dir_first = true
sort_reverse   = false
linemode       = "size"         # none | size | perm | owner | links | date
scrolloff      = 5
mouse_events  = ["click", "scroll", "touch", "drag", "move"]
title_format   = "{cwd} — Yazi"
# tab_width = 2
# show_symlink = false
# preview_cached_files_age = 86400

# ---- Preview pane --------------------------------------------------------
[preview]
# Image protocol: forced to "chafa" so inline previews work on stock
# alacritty. See the top-of-file note for the reason.
image            = "chafa"
image_filter     = "triangle"   # nearest | triangle | catmull-rom | lanczos3
image_quality    = 75           # 50-90
max_width        = 1600
max_height       = 1200
cache_dir        = ""           # empty = $XDG_CACHE_HOME/yazi

# chafa-specific tuning. Higher symbols/pixels per cell give a sharper
# preview but eat more rows; symbols = "all" enables Unicode half-block
# + braille so the image reads as a real picture, not an ASCII sketch.
[chafa]
format = "symbols"
symbols = "all"
dither = "none"
workaround = "none"
# Default fg/bg keep the preview from clashing with the rest of the UI.
fg = "cad3f5"
bg = "24273a"

# File-type specific preview scripts live in ~/.config/yazi/plugins/.
# Code highlighting, directory listing, archive listing, etc. are handled
# by the built-in previewers; custom prework/previewer/spotter plugins
# can be added under [plugin] below.

# ---- Opening files -------------------------------------------------------
[opener]
# Edit the cwd-file to make the terminal `cd` into the last visited dir
# when yazi quits. The companion shell hook is in keymap.toml ("cd on quit").
# Default openers (override per-filetype as needed):
#   txt, md   -> less            (or: $EDITOR for inline)
#   png, jpg  -> open in system viewer
#   *         -> noop

# ---- Plugin system -------------------------------------------------------
[plugin]
# preloaders   = []
# previewers   = []
# spotters     = []
# fetchers     = []

