# ~/.dots/config/hypr/hyprpaper.conf
# Default wallpaper. Picked up by the Hyprland adapter's autostart.conf.
#
# This file is regenerated by `bin/script-wallpaper` whenever you choose a
# new wallpaper from yazi — the script writes the chosen path here and
# restarts hyprpaper, which re-reads this file.
#
# The default points to ~/.dots/assets/background (managed by the dotfiles)
# so a fresh install always has a wallpaper on every output.

preload = ~/.dots/assets/background
wallpaper = ,~/.dots/assets/background
splash = false
ipc = on