general.import = [ "~/.dots/current/theme/alacritty.toml" ]

[env]
TERM = "xterm-256color"

[font]
normal = { family = "Fira Code Nerd Font", style = "Regular" }
bold = { family = "Fira Code Nerd Font", style = "Bold" }
italic = { family = "Fira Code Nerd Font", style = "Italic" }
size = 15

[window]
decorations = "none"
dynamic_padding = true
opacity = 0.9
padding.x = 10
padding.y = 3

[keyboard]
bindings = [
    { key = "K", mods = "Control", action = "ScrollLineUp" },
    { key = "J", mods = "Control", action = "ScrollLineDown" },
    { key = "F11", action = "ToggleFullscreen" }
]
