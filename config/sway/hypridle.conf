general {
    lock_cmd = pidof hyprlock || hyprlock -c ~/.dots/config/sway/hyprlock.conf # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = swaymsg "output * dpms on"  # to avoid having to press a key twice to turn on the display.
}

listener {
    timeout = 300                      # 5min
    on-timeout = loginctl lock-session # lock screen when timeout has passed
}

listener {
    timeout = 330                                            # 5.5min
    on-timeout = swaymsg "output * dpms off"                 # screen off when timeout has passed
    on-resume = swaymsg "output * dpms on" && brightnessctl -r # screen on when activity is detected
}
