##### General Settings #####

# Increase scrollback buffer
set -g history-limit 25000

# Disable mouse (unless you want mouse scrolling, etc.)
set -g mouse off

# Faster escape response (helps with Neovim)
set -sg escape-time 10

# Use vi keys in copy mode
setw -g mode-keys vi

# Set default terminal for 256-color compatibility
set-option -g default-terminal "screen-256color"

# Base index from 1 for both windows and panes
set -g base-index 1
setw -g pane-base-index 1

# Change prefix to Ctrl-s (instead of default Ctrl-b)
set -g prefix C-s

##### Status Bar #####

# Enable status bar
set -g status on

# Center tab labels
set -g status-justify centre

# Status bar style
set -g status-style fg=#c6d0f5,bg=default

# Show current working directory on the left
set -g status-left "#(pwd) "
set -g status-left-style fg=#c6d0f5

# Show clock on the right
set -g status-right "%H:%M"
set -g status-right-style fg=#c6d0f5

# Style for inactive window tabs
set -g window-status-style fg=#a6adc8,bg=default

# Style for active window tab
set -g window-status-current-style fg=#b4befe,bg=default,bold

##### Key Bindings #####

# Reload config with prefix + r
unbind r
bind-key r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Split panes with working dir
bind-key v split-window -h -c "#{pane_current_path}"
bind-key a split-window -v -c "#{pane_current_path}"

# Navigate panes
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Switch windows with Ctrl-h / Ctrl-l
bind-key -r C-h select-window -t :-
bind-key -r C-l select-window -t :+

##### TPM Plugin Manager #####

# TPM (tmux plugin manager)
set -g @plugin 'tmux-plugins/tpm'
run '~/.tmux/plugins/tpm/tpm'

