# Catppuccin Mocha — Fuzzel
# Matches ~/.dots/current/theme/mako.ini for the active theme.
# Color tokens lifted from mako.ini:
#   text          #cad3f5
#   border        #c6d0f5
#   background    #24273a
#   accent        #8caaee
#
# Fuzzel takes 8-digit hex (RRGGBBAA). Default alpha is "ff" (opaque);
# we keep everything opaque so the rounded corners have a clean edge
# instead of bleeding the desktop wallpaper through the gaps.

[main]
font = JetBrains Mono:size=12
prompt = ""
width = 50
horizontal-pad = 16
vertical-pad = 12
inner-pad = 10
line-height = 28
letter-spacing = 0
icons-enabled = no
icon-theme = "Papirus"
fields = "name,generic,comment,categories,filename"

[colors]
background      = 24273aff
text            = cad3f5ff
prompt          = c6d0f5ff
input           = cad3f5ff
match           = 8caaeeff
selection       = 8caaeeff
selection-text  = 24273aff
selection-match = c6d0f5ff
counter         = 6c7086ff
border          = c6d0f5ff
placeholder     = 6c7086ff

[border]
width = 2
radius = 0
selection-radius = 0
