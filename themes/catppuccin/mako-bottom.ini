# Catppuccin Mocha — Mako (bottom-center, system-info OSD)
#
# Used by the bottom mako instance. Anchored bottom-center so the
# volume/brightness/mic OSDs from XF86* keys and the keyboard-layout
# OSD from script-notify-layout are immediately visible. Slightly
# narrower and lower profile than the top-right config because every
# line is short (label + value) and we want at most two stacked.
#
# Reached via dots-system-notify, which routes notify-send calls to the
# secondary D-Bus session bus started by dots-session-buses.

text-color=#cad3f5
border-color=#8caaee
background-color=#1e2030
width=320
height=80
padding=8
border-size=2
font=Liberation Sans 11
anchor=bottom-center
outer-margin=40
default-timeout=2000
max-visible=2
max-icon-size=32
icon-border-radius=4

[mode=do-not-disturb]
invisible=true

[mode=do-not-disturb app-name=notify-send]
invisible=false