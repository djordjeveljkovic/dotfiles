# Catppuccin Mocha — Mako
#
# Top-right is the default anchor. Notifications that come in with
# the x-dots-position D-Bus hint (e.g. dots-system-notify wrapping
# notify-send for volume / brightness / mic / media) get
# re-anchored to the bottom-center and styled smaller / dimmer.

text-color=#cad3f5
border-color=#c6d0f5
background-color=#24273a
width=420
height=110
padding=10
border-size=2
font=Liberation Sans 11
anchor=top-right
outer-margin=20
# Force the topmost wl_layer_shell layer so notifications can appear above
# fullscreen apps (which Sway places on the top layer by default).
layer=overlay
default-timeout=5000
# Cap on-screen notifications; older ones get dropped when exceeded.
# Rapid volume/brightness presses use x-canonical-private-synchronous
# to replace-in-place, but unrelated notifications still pile up otherwise.
max-visible=3
# Screenshots get a longer timeout so you can read the path
[app-name=screenshot]
default-timeout=15000
# Composite screenshot previews (script-screenshot) arrive as image-path
# hints. They stack image+caption into one PNG at full notification width,
# so the cap must be >= width to avoid shrinking them.
max-icon-size=420
icon-border-radius=4

# Clock notification (every 15min via systemd). The body text is
# short ("Time Update HH:MM") so the global 420px width is
# wasted. Trim it.
[app-name=time]
width=200
default-timeout=2000

[app-name=Spotify]
invisible=1

[mode=do-not-disturb]
invisible=true

[mode=do-not-disturb app-name=notify-send]
invisible=false

# System-info OSDs (XF86* keys, keyboard layout switch) land
# here when the caller passes the x-dots-position D-Bus hint.
# The patched mako (branch position-hint, see patches/ in this
# repo) reads the hint, overrides the default anchor to
# bottom-center, and creates a separate layer-shell surface for
# them. Plain notify-send (no hint) still goes top-right.
[position=bottom-center]
anchor=bottom-center
background-color=#1e2030
border-color=#8caaee
width=200
height=64
padding=6
default-timeout=2000
outer-margin=40
max-visible=2
max-icon-size=32
icon-border-radius=4