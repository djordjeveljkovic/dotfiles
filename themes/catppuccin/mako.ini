# Catppuccin Mocha — Mako
#
# Top-right is the default anchor. Notifications that come in with
# the x-dots-position D-Bus hint (e.g. dots-system-notify wrapping
# notify-send for volume / brightness / mic / media) get
# re-anchored to the bottom-center and styled smaller / dimmer.

text-color=#cad3f5
border-color=#c6d0f5
background-color=#24273a
width=420
height=110
padding=10
border-size=2
font=Liberation Sans 11
anchor=top-right
outer-margin=20
default-timeout=5000
max-icon-size=32

[app-name=Spotify]
invisible=1

[mode=do-not-disturb]
invisible=true

[mode=do-not-disturb app-name=notify-send]
invisible=false

# System-info OSDs (XF86* keys, keyboard layout switch) land
# here when the caller passes x-dots-position=bottom-center. The
# patched mako (branch position-hint) reads that hint, overrides
# the default anchor to bottom-center, and creates a separate
# layer-shell surface for them.
[position=bottom-center]
anchor=bottom-center
background-color=#1e2030
border-color=#8caaee
width=320
height=80
padding=8
default-timeout=2000
outer-margin=40
max-visible=2
max-icon-size=32
icon-border-radius=4