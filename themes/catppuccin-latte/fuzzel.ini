# Catppuccin Latte — Fuzzel
# Matches ~/.dots/current/theme/mako.ini for the active theme.
# Color tokens lifted from mako.ini:
#   text          #4c4f69
#   border        #1e66f5
#   background    #eff1f5
#   accent        #1e66f5
#
# 8-digit hex (RRGGBBAA) keeps corners opaque.

[main]
font = JetBrains Mono:size=12
prompt = ""
width = 50
horizontal-pad = 16
vertical-pad = 12
inner-pad = 10
line-height = 28
letter-spacing = 0
icons-enabled = no
icon-theme = "Papirus"
fields = "name,generic,comment,categories,filename"

[colors]
background      = eff1f5ff
text            = 4c4f69ff
prompt          = 1e66f5ff
input           = 4c4f69ff
match           = 1e66f5ff
selection       = 1e66f5ff
selection-text  = eff1f5ff
selection-match = 4c4f69ff
counter         = 8c8fa1ff
border          = 1e66f5ff
placeholder     = 8c8fa1ff

[border]
width = 2
radius = 0
selection-radius = 0
