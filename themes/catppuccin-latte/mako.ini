# Catppuccin Latte — Mako

text-color=#4c4f69
border-color=#1e66f5
background-color=#eff1f5
width=420
height=110
padding=10
border-size=2
font=Liberation Sans 11
anchor=top-right
outer-margin=20
# Force the topmost wl_layer_shell layer so notifications can appear above
# fullscreen apps (which Sway places on the top layer by default).
layer=overlay
default-timeout=5000
# Cap on-screen notifications; older ones get dropped when exceeded.
# Rapid volume/brightness presses use x-canonical-private-synchronous
# to replace-in-place, but unrelated notifications still pile up otherwise.
max-visible=3
# Screenshots get a longer timeout so you can read the path
[app-name=screenshot]
default-timeout=15000
# Composite screenshot previews (script-screenshot) arrive as image-path
# hints. They stack image+caption into one PNG at full notification width,
# so the cap must be >= width to avoid shrinking them.
max-icon-size=420
icon-border-radius=4

# Clock notification (every 15min via systemd). The body text is
# short ("Time Update HH:MM") so the global 420px width is
# wasted. Trim it.
[app-name=time]
width=200
default-timeout=2000

[app-name=Spotify]
invisible=1

[mode=do-not-disturb]
invisible=true

[mode=do-not-disturb app-name=notify-send]
invisible=false

# System-info OSDs (XF86* keys, keyboard layout switch) land
# here when the caller passes x-dots-position=bottom-center. The
# patched mako (branch position-hint) reads that hint, overrides
# the default anchor to bottom-center, and creates a separate
# layer-shell surface for them.
[position=bottom-center]
anchor=bottom-center
background-color=#dce0e8
border-color=#1e66f5
width=200
height=64
padding=6
default-timeout=2000
outer-margin=40
max-visible=2
max-icon-size=32
icon-border-radius=4

# System-info OSD (script-info, $mod+i). 18 flat key/value rows
# covering time, hardware, audio, compositor, network. Wider
# than the bottom-center OSDs (520 vs 200), taller (420 vs 110),
# and a longer timeout (8s vs 2s) so the body is actually
# readable. Same color scheme as bottom-center so the only
# differentiator is position.
#
# Height is the cap on rendered text height — mako ellipsizes
# anything beyond it (see PANGO_ELLIPSIZE_END in render.c).
# Without an explicit height= here this block inherits the
# global 110, which only fits ~3 lines of body. 420 fits all
# 18 rows + the bold summary at Liberation Sans 11 with room
# for per-core temps lines to wrap.
[position=center]
anchor=center
background-color=#dce0e8
border-color=#1e66f5
width=520
height=420
padding=8
default-timeout=8000
outer-margin=40
max-visible=1
max-icon-size=32
icon-border-radius=4
