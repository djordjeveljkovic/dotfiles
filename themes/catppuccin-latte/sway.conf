# Sway window/border colors — included by config/sway/config via
# `include ~/.dots/current/theme/sway.conf*`. Palette matches mako/waybar/btop.
#
# Sway client class format:
#   client.<class> <border> <background> <text> <indicator> <child_border>

set $theme_bg     #24273a
set $theme_fg     #cad3f5
set $theme_accent #8caaee
set $theme_urgent #ed8796

# class                 border         background     text       indicator      child_border
client.focused          $theme_accent  $theme_accent  $theme_bg  $theme_accent  $theme_accent
client.focused_inactive $theme_bg      $theme_bg      $theme_fg  $theme_bg      $theme_bg
client.unfocused        $theme_bg      $theme_bg      $theme_fg  $theme_bg      $theme_bg
client.urgent           $theme_urgent  $theme_urgent  $theme_fg  $theme_urgent  $theme_urgent
client.placeholder      $theme_bg      $theme_bg      $theme_fg  $theme_bg      $theme_bg
client.background       $theme_bg
