# Catppuccin Latte — Mako (bottom-center, system-info OSD)
#
# Light counterpart of catppuccin/mako-bottom.ini. Used by the bottom
# mako instance when the active theme is Catppuccin Latte.

text-color=#4c4f69
border-color=#1e66f5
background-color=#dce0e8
width=320
height=80
padding=8
border-size=2
font=Liberation Sans 11
anchor=bottom-center
outer-margin=40
default-timeout=2000
max-visible=2
max-icon-size=32
icon-border-radius=4

[mode=do-not-disturb]
invisible=true

[mode=do-not-disturb app-name=notify-send]
invisible=false