# Fuzzel theme -- Catppuccin Macchiato palette shared with current/theme/mako.ini.
#   bg #24273a   fg #cad3f5   border #c6d0f5   accent #8caaeeff   dim #6e738d
#
# Geometry diverges from mako on purpose: fuzzel is the primary app launcher,
# so it sits centered on screen with DejaVu Sans 18pt and a larger line-height
# to make icons pop. Borders are square (radius=0) and the default "> " prompt
# is removed.
#
# Fuzzel reads RGBA 8-digit hex (no #). Colors live in [colors], border
# geometry in [border], everything else (font/anchor/layer/size) in [main].
#
# XDG location fuzzel auto-loads: ~/.config/fuzzel/fuzzel.ini
# This file is symlinked into place by install/4-config.sh.

[main]
# ---- Geometry: centered on screen, square corners, generous padding
anchor=center
# x/y-margin are ignored when anchor=center; kept at 0 for clarity.
x-margin=0
y-margin=0
horizontal-pad=16
vertical-pad=14
lines=5
# Width in characters; ~50 chars @ DejaVu Sans 18 ~= mako's 420px panel.
width=50

# ---- Typography: DejaVu Sans 18pt (mako uses Liberation Sans 11 for
# notifications; fuzzel is the primary app launcher so it gets a bigger font)
font=DejaVu Sans:size=18

# Override font-metrics line-height so icons render ~50% taller than the
# natural cap height. Fuzzel sizes icons to line-height.
line-height=36

# Empty prompt -- fuzzel defaults to "> " which we don't want.
prompt=""

# Layer=overlay so fuzzel renders above fullscreen apps (sway places the
# focused fullscreen client on the top layer -- see mako.ini for the same note).
layer=overlay

# App launcher mode: keep icons, match against name+generic+exec.
fields=name,generic,exec
icon-theme=default
icons-enabled=yes
match-mode=fzf

[colors]
# 1:1 with mako's three notification colors.
background=24273aff
text=cad3f5ff
border=c6d0f5ff

# Prompt / input / placeholder / message -- accent for prompt, dim for placeholder,
# fg for input/message (same as mako's text-color).
prompt=8caaeeff
input=cad3f5ff
placeholder=6e738dff
message=cad3f5ff

# Match highlight + selection (mako has no analogue -- picked from palette).
# selection = surface1 (#363a4f) -- one step lighter than base for readability.
match=8caaeeff
selection=363a4fff
selection-text=cad3f5ff
selection-match=8caaeeff
counter=6e738dff

[border]
# 2px border matches mako's border-size=2; square corners (radius=0) — fuzzel
# uses a different shape language than mako's rounded notification panels.
width=2
radius=0
selection-radius=0
